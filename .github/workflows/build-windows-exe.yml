name: Build Windows exe

# Builds PasteScribe.exe (a single file, no console window) on a Windows machine.
# Run it from the "Actions" tab ("Run workflow") or by pushing a tag like v1.4.0.
# The .exe is downloadable from the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['claude/text-typing-app-extension-w6eixt']  # TEMPORARY: validation run

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Build PasteScribe.exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name PasteScribe --icon pastescribe.ico
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          --hidden-import pynput._util.win32 --hidden-import pynput._util.win32_vks
          pastescribe.py

      - name: Self-test of the built .exe
        shell: cmd
        run: |
          start /wait "" dist\PasteScribe.exe --selftest
          echo self-test exit code: %errorlevel%
          if exist "%USERPROFILE%\.pastescribe.log" type "%USERPROFILE%\.pastescribe.log"
          exit /b %errorlevel%

      - uses: actions/upload-artifact@v4
        with:
          name: PasteScribe-windows
          path: desktop-app/dist/PasteScribe.exe
          if-no-files-found: error
